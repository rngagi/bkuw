name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for successful CI on the tagged commit
        id: source-ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run_record="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=1 \
              --jq '.workflow_runs[0] | if . == null then empty else [.id, .status, (.conclusion // "")] | @tsv end')"

            if [[ -z "$run_record" ]]; then
              echo "Waiting for a main CI run for $GITHUB_SHA ($attempt/60)."
            else
              IFS=$'\t' read -r run_id run_status run_conclusion <<< "$run_record"
              if [[ "$run_status" == "completed" && "$run_conclusion" == "success" ]]; then
                echo "Verified successful main CI run $run_id for $GITHUB_SHA."
                exit 0
              fi
              if [[ "$run_status" == "completed" ]]; then
                echo "Main CI run $run_id completed with conclusion: $run_conclusion." >&2
                echo "Fix or rerun that CI before retrying this release workflow." >&2
                exit 1
              fi
              echo "Main CI run $run_id is $run_status ($attempt/60)."
            fi
            sleep 30
          done

          echo "Timed out waiting for successful main CI for $GITHUB_SHA." >&2
          exit 1
      - name: Verify tag and application versions
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          test "$package_version" = "$release_version"
          test "$tauri_version" = "$release_version"
          test "$cargo_version" = "$release_version"

  build-installers:
    name: Build ${{ matrix.name }} installer
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact_name: bkuw-macos-apple-silicon
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact_name: bkuw-windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Prepare GitHub Release
    needs: build-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bkuw-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Collect installers and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          find downloaded-artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp '{}' release-files/ \;
          test "$(find release-files -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find release-files -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          cd release-files
          sha256sum -- *.dmg *.exe > SHA256SUMS.txt
      - name: Create draft release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEADER: |
            ## Downloads / 下載

            - Windows x64: download the NSIS `setup.exe` installer.
            - macOS Apple Silicon: download the `.dmg` image. macOS Intel is not supported.
            - Verify downloads with `SHA256SUMS.txt` when needed.

            ## Unsigned build notice / 未簽署版本提醒

            These installers are not yet code-signed or notarized. Windows SmartScreen and macOS Gatekeeper may show a warning.

            這些安裝包尚未進行程式碼簽章或 Apple notarization，Windows SmartScreen 與 macOS Gatekeeper 可能顯示警告。

            If a trusted macOS download reports that `bkuw.app` is damaged, first try **System Settings → Privacy & Security → Open Anyway**. If necessary, verify the download checksum and then run:

            ```bash
            sudo xattr -dr com.apple.quarantine /Applications/bkuw.app
            ```

            Only remove quarantine after confirming that the app came from this repository and its checksum matches.
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-files/*.dmg \
            release-files/*.exe \
            release-files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "bkuw $GITHUB_REF_NAME" \
            --notes "$RELEASE_HEADER"
