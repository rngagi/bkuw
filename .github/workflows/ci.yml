name: ci

on:
  push:
  pull_request:

jobs:
  portable-xelatex-template:
    name: Portable XeLaTeX template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri and XeLaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf texlive-xetex texlive-latex-extra
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile generated portable template with real XeLaTeX
        run: cargo test --manifest-path src-tauri/Cargo.toml portable_xelatex_template_compiles_with_the_real_engine -- --ignored

  verify-and-bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact_name: bkuw-macos-apple-silicon
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact_name: bkuw-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:rust
      - run: pnpm test:e2e:build
      - run: pnpm test:e2e
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Prepare GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - portable-xelatex-template
      - verify-and-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bkuw-*
          path: downloaded-artifacts
      - name: Verify tag and application versions
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          test "$package_version" = "$release_version"
          test "$tauri_version" = "$release_version"
          test "$cargo_version" = "$release_version"
      - name: Collect installers and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          find downloaded-artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp '{}' release-files/ \;
          test "$(find release-files -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find release-files -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          cd release-files
          sha256sum -- *.dmg *.exe > SHA256SUMS.txt
      - name: Create draft release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEADER: |
            ## Downloads / 下載

            - Windows x64: download the NSIS `setup.exe` installer.
            - macOS Apple Silicon: download the `.dmg` image. macOS Intel is not supported.
            - Verify downloads with `SHA256SUMS.txt` when needed.

            ## Unsigned build notice / 未簽署版本提醒

            These installers are not yet code-signed or notarized. Windows SmartScreen and macOS Gatekeeper may show a warning.

            這些安裝包尚未進行程式碼簽章或 Apple notarization，Windows SmartScreen 與 macOS Gatekeeper 可能顯示警告。

            If a trusted macOS download reports that `bkuw.app` is damaged, first try **System Settings → Privacy & Security → Open Anyway**. If necessary, verify the download checksum and then run:

            ```bash
            sudo xattr -dr com.apple.quarantine /Applications/bkuw.app
            ```

            Only remove quarantine after confirming that the app came from this repository and its checksum matches.
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-files/*.dmg \
            release-files/*.exe \
            release-files/SHA256SUMS.txt \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "bkuw $GITHUB_REF_NAME" \
            --notes "$RELEASE_HEADER"
