name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  portable-xelatex-template:
    name: Portable XeLaTeX template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri and XeLaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf texlive-xetex texlive-latex-extra
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile generated portable template with real XeLaTeX
        run: cargo test --manifest-path src-tauri/Cargo.toml portable_xelatex_template_compiles_with_the_real_engine -- --ignored

  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:rust
      - run: pnpm tauri build --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json --target ${{ matrix.target }}
      - run: pnpm test:e2e
        env:
          BKUW_E2E_APPLICATION: ./src-tauri/target/${{ matrix.target }}/release/bkuw
