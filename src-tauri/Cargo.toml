[package]
name = "bkuw"
version = "0.3.1"
description = "A local-first lexical fieldwork database"
authors = ["bkuw contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bkuw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
fs2 = "0.4"
hex = "0.4"
icu_collator = "2.2"
icu_locale = "2.2"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
sha2 = "0.10"
thiserror = "2"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
wait-timeout = "0.2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }
tauri-plugin-wdio = { version = "1.3", optional = true }
tauri-plugin-opener = "2"
tempfile = "3"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
