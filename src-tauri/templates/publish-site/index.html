<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Online dictionary" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8f6" />
    <title>Online dictionary</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-title-link" href="#/" id="site-title">線上辭典</a>
      <div class="header-controls">
        <button id="info-button" class="icon-button" type="button" aria-label="關於本辭典" title="關於本辭典" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </button>
        <button id="theme-button" class="icon-button" type="button" aria-label="切換至深色模式" title="切換至深色模式">
          <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24" hidden><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
          <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <main class="workspace" aria-busy="true">
      <aside class="list-pane" aria-label="詞項列表">
        <div class="list-toolbar">
          <label class="search-field">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span class="sr-only" data-i18n="search">搜尋詞項</span>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜尋詞形或釋義" aria-label="搜尋詞項" />
          </label>
          <p id="result-summary" class="result-summary" aria-live="polite"></p>
        </div>
        <nav id="entry-list" class="entry-list" aria-label="詞項"></nav>
      </aside>

      <section class="detail-pane" aria-labelledby="entry-heading">
        <div class="mobile-detail-bar">
          <button id="back-button" class="text-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
            <span data-i18n="backToList">返回詞項列表</span>
          </button>
        </div>
        <div id="entry-detail" class="detail-scroll">
          <div class="state-panel" role="status">
            <span class="loading-mark" aria-hidden="true"></span>
            <p data-i18n="loading">正在載入辭典…</p>
          </div>
        </div>
      </section>
    </main>

    <dialog id="info-dialog" class="info-dialog" aria-label="關於本辭典">
      <div class="dialog-toolbar">
        <span data-i18n="aboutDictionary">關於本辭典</span>
        <button id="info-close-button" class="icon-button" type="button" aria-label="關閉" title="關閉">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="info-content" class="info-content"></div>
    </dialog>

    <a class="bkuw-credit" href="https://rngagi.github.io/bkuw" target="_blank" rel="noopener noreferrer">
      <span data-i18n="poweredBy">使用 bkuw 建立 &amp; 發布</span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg>
    </a>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
  </body>
</html>
