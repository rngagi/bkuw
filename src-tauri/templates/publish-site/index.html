<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Online dictionary">
    <link rel="icon" href="./favicon.svg">
    <link rel="stylesheet" href="./styles.css">
    <title>Online dictionary</title>
  </head>
  <body>
    <a class="skip-link" href="#entry-detail">Skip to entry</a>
    <header class="site-header">
      <button class="mobile-back" id="back-button" type="button" hidden aria-label="Back to word list">‹</button>
      <h1 id="site-title">Online dictionary</h1>
      <nav class="header-actions" aria-label="Site controls">
        <button class="icon-button" id="info-button" type="button" hidden aria-label="About this dictionary">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>
        </button>
        <button class="icon-button" id="theme-button" type="button" aria-label="Use dark theme">
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </header>

    <main class="workspace" id="workspace">
      <aside class="entry-pane" aria-label="Dictionary entries">
        <div class="search-wrap">
          <label class="sr-only" for="search-input">Search dictionary</label>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search-input" type="search" autocomplete="off" placeholder="Search">
        </div>
        <p class="entry-count" id="entry-count" aria-live="polite"></p>
        <div class="entry-list" id="entry-list" role="listbox" aria-label="Dictionary entries"></div>
      </aside>
      <article class="entry-detail" id="entry-detail" tabindex="-1">
        <div class="state-message" id="detail-state" role="status">Loading dictionary…</div>
        <div id="detail-content" hidden></div>
      </article>
    </main>

    <dialog class="info-dialog" id="info-dialog" aria-labelledby="info-title">
      <div class="dialog-header"><h2 id="info-title">About this dictionary</h2><button class="icon-button" id="info-close" type="button" aria-label="Close">×</button></div>
      <div class="prose" id="info-content"></div>
    </dialog>

    <a class="bkuw-credit" href="https://rngagi.github.io/bkuw" target="_blank" rel="noopener noreferrer">使用 bkuw 建立 &amp; 發布</a>
    <script src="./app.js" defer></script>
  </body>
</html>
